name: Compilar APK de Portal IPTV FITO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Agregar plataforma Android
        run: npx cap add android

      - name: Sincronizar proyecto
        run: npx cap sync android

      - name: Compilar APK (debug, instalable directo)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Subir APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: PortalIPTV-FITO-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk